title: "Complete Hindi"
subtitle: "Chapter 07"
items:
  - id: "0001"
    hindi: "दादी जी, बचपन में आप लोग कानपुर में रहते थे न?"
    romanisation: "dādī jī, bacpan mẽ āp log kānpur mẽ rahte the na?"
    english: "Grandma, in your childhood you people used to live in Kanpur, didn't you?"
  - id: "0002"
    hindi: "मेरे पिताजी किसी कालेज में उर्दू पढ़ाते थे।"
    romanisation: "mere pitājī kisī kālej mẽ urdū paṛhāte the."
    english: "My father used to teach Urdu in some college."
  - id: "0003"
    hindi: "माँ भी पढ़ाती थीं।"
    romanisation: "mā̃ bhī paṛhātī thī̃."
    english: "Mother used to teach too."
  - id: "0004"
    hindi: "आपके घर में कोई अँग्रेज़ी बोलता था?"
    romanisation: "āpke ghar mẽ koī aṃgrezī boltā thā?"
    english: "Did anyone speak English in your home?"
  - id: "0005"
    hindi: "हाँ, पिताजी को कोई पाँच भाषाएँ आती थीं।"
    romanisation: "hā̃, pitājī ko koī pā̃c bhāṣāẽ ātī thī̃."
    english: "Yes, Father knew about five languages."
  - id: "0006"
    hindi: "पर हम लोग ज़्यादातर हिन्दी बोलते थे।"
    romanisation: "par ham log zyādātar hindī bolte the."
    english: "But we mostly spoke Hindi."
  - id: "0007"
    hindi: "क्या आपके घर के नज़दीक कोई सिनेमा था?"
    romanisation: "kyā āpke ghar ke nazdīk koī sinemā thā?"
    english: "Was there any cinema near your house?"
  - id: "0008"
    hindi: "हम लोग हर शनिवार को कुछ सहेलियों के साथ सिनेमा जाते थे।"
    romanisation: "ham log har śanivār ko kuch saheliyõ ke sāth sinemā jāte the."
    english: "We used to go to the cinema every Saturday with some friends."
  - id: "0009"
    hindi: "अपनी सहेलियों के बारे में कुछ बताइए।"
    romanisation: "apnī saheliyõ ke bāre mẽ kuch batāie."
    english: "Tell me something about your friends."
  - id: "0010"
    hindi: "एक मुसलमान डाक्टर की बेटी मेरी ख़ास सहेली थी।"
    romanisation: "ek musalmān ḍākṭar kī beṭī merī khās sahelī thī."
    english: "A Muslim doctor's daughter was my special friend."
  - id: "0011"
    hindi: "वह मुझसे कुछ बड़ी थी।"
    romanisation: "vah mujhse kuch baṛī thī."
    english: "She was a bit older than me."
  - id: "0012"
    hindi: "अच्छा दादी जी, मैं चलती हूँ।"
    romanisation: "acchā dādī jī, maĩ caltī hū̃."
    english: "OK Grandma, I'm off."
  - id: "0013"
    hindi: "आपको कुछ चाहिए?"
    romanisation: "āpko kuch cāhie?"
    english: "Do you need anything?"
  - id: "0014"
    hindi: "नहीं बेटी, तेरी बूढ़ी दादी को कुछ नहीं चाहिए।"
    romanisation: "nahī̃ beṭī, terī būṛhī dādī ko kuch nahī̃ cāhie."
    english: "No child, your old Grandma doesn't need anything."
  - id: "0015"
    hindi: "तू जा, अपना काम कर।"
    romanisation: "tū jā, apnā kām kar."
    english: "Off you go, do your work."
  - id: "0016"
    hindi: "मैं तुझे ख़त लिखता था।"
    romanisation: "maĩ tujhe khat likhtā thā."
    english: "I used to write you letters."
  - id: "0017"
    hindi: "तू कभी कभी जवाब देती थी।"
    romanisation: "tū kabhī kabhī javāb detī thī."
    english: "You sometimes used to reply."
  - id: "0018"
    hindi: "किताबें सस्ती होती थीं।"
    romanisation: "kitābẽ sastī hotī thī̃."
    english: "Books used to be cheap."
  - id: "0019"
    hindi: "हम दोनों बहुत-सारी किताबें पढ़ते थे।"
    romanisation: "ham donõ bahut-sārī kitābẽ paṛhte the."
    english: "We both used to read lots of books."
  - id: "0020"
    hindi: "रविवार को हम लंबी सैर करते।"
    romanisation: "ravivār ko ham lambī sair karte."
    english: "On Sundays we would take a long walk."
  - id: "0021"
    hindi: "शाम को मैं अक्सर सिग्रेट पीता।"
    romanisation: "śām ko maĩ aksar sigreṭ pītā."
    english: "I would often smoke in the evening."
  - id: "0022"
    hindi: "ज़मीन पर कोई पड़ा था।"
    romanisation: "zamīn par koī paṛā thā."
    english: "There was someone lying on the ground."
  - id: "0023"
    hindi: "ज़मीन पर कुछ पड़ा था।"
    romanisation: "zamīn par kuch paṛā thā."
    english: "There was something lying on the ground."
  - id: "0024"
    hindi: "घर में कोई नहीं है।"
    romanisation: "ghar mẽ koī nahī̃ hai."
    english: "There's nobody in the house."
  - id: "0025"
    hindi: "घर में कुछ नहीं है।"
    romanisation: "ghar mẽ kuch nahī̃ hai."
    english: "There's nothing in the house."
  - id: "0026"
    hindi: "यहाँ कोई गोश्त नहीं खाता है।"
    romanisation: "yahā̃ koī gośt nahī̃ khātā hai."
    english: "Nobody here eats meat."
  - id: "0027"
    hindi: "डिब्बे में कोई अँग्रेज़ बैठा था।"
    romanisation: "ḍibbe mẽ koī aṃgrez baiṭhā thā."
    english: "There was some Englishman sitting in the compartment."
  - id: "0028"
    hindi: "कोई अख़बार फ़र्श पर पड़ा था।"
    romanisation: "koī akhbār farś par paṛā thā."
    english: "Some newspaper was lying on the floor."
  - id: "0029"
    hindi: "किसी से मत कहना कि मैं यहाँ खड़ा हूँ।"
    romanisation: "kisī se mat kahnā ki maĩ yahā̃ khaṛā hū̃."
    english: "Don't tell anyone that I'm standing here."
  - id: "0030"
    hindi: "यह रोटी किसी बच्चे को दो।"
    romanisation: "yah roṭī kisī bacce ko do."
    english: "Give this bread to some child."
  - id: "0031"
    hindi: "कुछ विदेशी अच्छी हिन्दी बोलते हैं।"
    romanisation: "kuch videśī acchī hindī bolte haĩ."
    english: "Some foreigners speak good Hindi."
  - id: "0032"
    hindi: "कुछ अँग्रेज़ों को सिर्फ़ अँग्रेज़ी आती है।"
    romanisation: "kuch aṃgrezõ ko sirf aṃgrezī ātī hai."
    english: "Some English people only know English."
  - id: "0033"
    hindi: "उसकी जेब में कुछ पैसा था।"
    romanisation: "uskī jeb mẽ kuch paisā thā."
    english: "There was some money in his pocket."
  - id: "0034"
    hindi: "कुछ दाल-रोटी लीजिए न?"
    romanisation: "kuch dāl-roṭī lījie na?"
    english: "Take some daal and roti, won't you?"
  - id: "0035"
    hindi: "यह कपड़ा कुछ मोटा है।"
    romanisation: "yah kapṛā kuch moṭā hai."
    english: "This cloth is rather coarse."
  - id: "0036"
    hindi: "यह कुर्ता कुछ लंबा है।"
    romanisation: "yah kurtā kuch lambā hai."
    english: "This kurta is a bit long."
  - id: "0037"
    hindi: "डिब्बे में कोई दस मोती पड़े थे।"
    romanisation: "ḍibbe mẽ koī das motī paṛe the."
    english: "There were about ten pearls lying in the box."
  - id: "0038"
    hindi: "शहर में कोई आठ-नौ होटल हैं।"
    romanisation: "śahar mẽ koī āṭh-nau hoṭal haĩ."
    english: "There are about eight or nine hotels in the town."
  - id: "0039"
    hindi: "दादी को नया चश्मा चाहिए।"
    romanisation: "dādī ko nayā caśmā cāhie."
    english: "Grandma needs new glasses."
  - id: "0040"
    hindi: "आपको क्या चाहिए?"
    romanisation: "āpko kyā cāhie?"
    english: "What do you want/need?"
  - id: "0041"
    hindi: "हमें रोटी चाहिए, चावल नहीं।"
    romanisation: "hamẽ roṭī cāhie, cāval nahī̃."
    english: "We want roti, not rice."
  - id: "0042"
    hindi: "हमें दो साइकिलें चाहिए थीं।"
    romanisation: "hamẽ do sāikileṃ cāhie thī̃."
    english: "We needed two bicycles."
  - id: "0043"
    hindi: "मुझे इसी रंग का कपड़ा चाहिए था।"
    romanisation: "mujhe isī raṃg kā kapṛā cāhie thā."
    english: "I needed cloth of this colour."
  - id: "0044"
    hindi: "प्रकाश, इन सब कमरों में कौन कौन काम करता है?"
    romanisation: "Prakāś, in sab kamrõ mẽ kaun kaun kām kartā hai?"
    english: "Prakash, who works in all these rooms?"
  - id: "0045"
    hindi: "पहले और दूसरे कमरों में दफ़्तर के बड़े बाबू काम करते हैं।"
    romanisation: "pahle aur dūsre kamrõ mẽ daftar ke baṛe bābū kām karte haĩ."
    english: "In the first and second rooms the senior clerks of the office work."
  - id: "0046"
    hindi: "और यह तीसरा कमरा किसका है?"
    romanisation: "aur yah tīsrā kamrā kiskā hai?"
    english: "And whose is this third room?"
  - id: "0047"
    hindi: "अभी तीसरे और चौथे कमरों में कोई नहीं है सर।"
    romanisation: "abhī tīsre aur cauthe kamrõ mẽ koī nahī̃ hai sar."
    english: "There's nobody in the third and fourth rooms yet sir."
  - id: "0048"
    hindi: "तो आपका कमरा कौनसा है?"
    romanisation: "to āpkā kamrā kaunsā hai?"
    english: "So which is your room?"
  - id: "0049"
    hindi: "पाँचवाँ? छठा?"
    romanisation: "pā̃cvā̃? chaṭhā?"
    english: "The fifth? The sixth?"
  - id: "0050"
    hindi: "तीसरा कमरा ख़ाली है, उसे लेना।"
    romanisation: "tīsrā kamrā khālī hai, use lenā."
    english: "The third room's vacant – take it."
  - id: "0051"
    hindi: "आपको और कोई चीज़ चाहिए?"
    romanisation: "āpko aur koī cīz cāhie?"
    english: "Do you need anything else?"
  - id: "0052"
    hindi: "उस कमरे में नया पंखा चाहिए।"
    romanisation: "us kamre mẽ nayā pankhā cāhie."
    english: "A new fan is needed in that room."
  - id: "0053"
    hindi: "बहुत ज़रूरी है – पुराना पंखा काम नहीं करता।"
    romanisation: "bahut zarūrī hai – purānā pankhā kām nahī̃ kartā."
    english: "It's very urgent – the old fan doesn't work."
  - id: "0054"
    hindi: "गर्मी का मौसम मार्च से पहले नहीं शुरू होता।"
    romanisation: "garmī kā mausam mārc se pahle nahī̃ śurū hotā."
    english: "The hot weather doesn't start before March."
  - id: "0055"
    hindi: "पंखा बाद में लेना।"
    romanisation: "pankhā bād mẽ lenā."
    english: "Get a fan later on."
  - id: "0056"
    hindi: "हमारी क्लास नौ बजे शुरू होती है।"
    romanisation: "hamārī klās nau baje śurū hotī hai."
    english: "Our class begins at nine o'clock."
  - id: "0057"
    hindi: "दरवाज़े रात को बंद होते हैं।"
    romanisation: "darvāze rāt ko band hote haĩ."
    english: "The doors are closed at night."
  - id: "0058"
    hindi: "छुट्टियाँ अक्सर शनिवार को शुरू होती हैं।"
    romanisation: "chuṭṭiyā̃ aksar śanivār ko śurū hotī haĩ."
    english: "The holidays usually start on a Saturday."
