title: "Complete Hindi"
subtitle: "Chapter 06"
items:
  - hindi: "प्रकाश, बताइए, आपका मेहमान प्रताप – वह क्या करता है?"
    romanisation: "Prakāś, batāie, āpkā mehmān Pratāp – vah kyā kartā hai?"
    english: "Prakash, tell me, your guest Pratap – what does he do?"
  - hindi: "वह विद्यार्थी है।"
    romanisation: "vah vidyārthī hai."
    english: "He's a student."
  - hindi: "एक प्राइवेट स्कूल में हिन्दी सीखता है।"
    romanisation: "ek prāiveṭ skūl mẽ hindī sīkhtā hai."
    english: "He learns Hindi in a private school."
  - hindi: "उसका उच्चारण बहुत साफ़ है।"
    romanisation: "uskā uccāraṇ bahut sāf hai."
    english: "His pronunciation is very clear."
  - hindi: "हाँ, प्रताप अच्छा बोलता है।"
    romanisation: "hā̃, Pratāp acchā boltā hai."
    english: "Yes, Pratap speaks well."
  - hindi: "वैसे वह बहुत होनहार लड़का है।"
    romanisation: "vaise vah bahut honahār laṛkā hai."
    english: "Actually he's a very promising boy."
  - hindi: "मालूम होता है कि संगीता उससे नफ़रत करती है।"
    romanisation: "mālūm hotā hai ki Sangītā usse nafrat kartī hai."
    english: "It seems Sangeeta dislikes him."
  - hindi: "मैं नहीं जानता।"
    romanisation: "maĩ nahī̃ jāntā."
    english: "I don't know."
  - hindi: "पर संगीता सोचती है कि प्रताप उससे प्यार करता है।"
    romanisation: "par Sangītā soctī hai ki Pratāp usse pyār kartā hai."
    english: "But Sangeeta thinks that Pratap loves her."
  - hindi: "राज हमेशा घर पर क्यों रहता है?"
    romanisation: "Rāj hameśā ghar par kyõ rahtā hai?"
    english: "Why does Raj always stay at home?"
  - hindi: "वह दिन भर क्या करता है?"
    romanisation: "vah din bhar kyā kartā hai?"
    english: "What does he do all day?"
  - hindi: "खेलता है, खाता है, सोता है, शरारत करता है।"
    romanisation: "kheltā hai, khātā hai, sotā hai, śarārat kartā hai."
    english: "He plays, eats, sleeps, makes mischief."
  - hindi: "बच्चा है, न?"
    romanisation: "baccā hai, na?"
    english: "He's a kid, isn't he?"
  - hindi: "यह अच्छी बात नहीं है कि लड़का घर पर अकेला रहता है।"
    romanisation: "yah acchī bāt nahī̃ hai ki laṛkā ghar par akelā rahtā hai."
    english: "It's not good that the boy stays alone at home."
  - hindi: "अरे छोड़ो इन बातों को सुरेश!"
    romanisation: "are choṛo in bātõ ko Sureś!"
    english: "Oh leave these things, Suresh!"
  - hindi: "मैं शुद्ध हिन्दी बोलता हूँ।"
    romanisation: "maĩ śuddh hindī boltā hū̃."
    english: "I speak pure Hindi."
  - hindi: "क्या श्रीमती खन्ना पंजाबी समझती हैं?"
    romanisation: "kyā śrīmatī Khannā pañjābī samajhtī haĩ?"
    english: "Does Mrs Khanna understand Punjabi?"
  - hindi: "तुम कहाँ रहते हो?"
    romanisation: "tum kahā̃ rahte ho?"
    english: "Where do you live?"
  - hindi: "प्रताप कभी कभी शराब पीता है।"
    romanisation: "Pratāp kabhī kabhī śarāb pītā hai."
    english: "Pratap sometimes drinks."
  - hindi: "मैं सिग्रेट कभी नहीं पीता।"
    romanisation: "maĩ sigreṭ kabhī nahī̃ pītā."
    english: "I never smoke."
  - hindi: "शर्मा जी गोश्त नहीं खाते।"
    romanisation: "Śarmā jī gośt nahī̃ khāte."
    english: "Sharma ji does not eat meat."
  - hindi: "वह लखनऊ में नहीं रहती, दिल्ली में रहती है।"
    romanisation: "vah lakhnū mẽ nahī̃ rahtī, dillī mẽ rahtī hai."
    english: "She doesn't live in Lucknow, she lives in Delhi."
  - hindi: "दादी जी गोश्त खाती हैं।"
    romanisation: "dādī jī gośt khātī haĩ."
    english: "Dadi ji eats meat."
  - hindi: "दादी जी गोश्त नहीं खातीं।"
    romanisation: "dādī jī gośt nahī̃ khātī̃."
    english: "Dadi ji doesn't eat meat."
  - hindi: "वह सोचता है कि तुम्हारा उच्चारण अच्छा है।"
    romanisation: "vah soctā hai ki tumhārā uccāraṇ acchā hai."
    english: "He thinks that your pronunciation is good."
  - hindi: "मैं अक्सर अकेलापन महसूस करता हूँ।"
    romanisation: "maĩ aksar akelāpan mahsūs kartā hū̃."
    english: "I often experience loneliness."
  - hindi: "राज नौ बजे स्कूल जाता है।"
    romanisation: "Rāj nau baje skūl jātā hai."
    english: "Raj goes to school at nine o'clock."
  - hindi: "आप कितने बजे उठती हैं?"
    romanisation: "āp kitne baje uṭhtī haĩ?"
    english: "What time do you get up?"
  - hindi: "मैं सात बजे उठती हूँ।"
    romanisation: "maĩ sāt baje uṭhtī hū̃."
    english: "I get up at seven o'clock."
  - hindi: "मुझको थोड़ी उर्दू आती है।"
    romanisation: "mujhko thoṛī urdū ātī hai."
    english: "I know a little Urdu."
  - hindi: "तुमको कितनी भाषाएँ आती हैं?"
    romanisation: "tumko kitnī bhāṣāẽ ātī haĩ?"
    english: "How many languages do you know?"
  - hindi: "इस लिपि को क्या कहते हैं?"
    romanisation: "is lipi ko kyā kahte haĩ?"
    english: "What's this script called?"
  - hindi: "इसको देवनागरी कहते हैं।"
    romanisation: "isko devanāgarī kahte haĩ."
    english: "They call it Devanagari."
  - hindi: "अच्छी साड़ियाँ महँगी होती हैं।"
    romanisation: "acchī sāṛiyā̃ mahãgī hotī haĩ."
    english: "Good saris are expensive."
  - hindi: "हाँ, लेकिन यह साड़ी सस्ती है।"
    romanisation: "hā̃, lekin yah sāṛī sastī hai."
    english: "Yes, but this sari is cheap."
  - hindi: "मालूम होता है कि माँ नाराज़ हैं।"
    romanisation: "mālūm hotā hai ki mā̃ nārāz haĩ."
    english: "It seems Mother's angry."
  - hindi: "मुझे मालूम है कि माँ नाराज़ हैं।"
    romanisation: "mujhe mālūm hai ki mā̃ nārāz haĩ."
    english: "I know Mother's angry."
  - hindi: "तुम्हारा कुत्ता हमारे घर में है।"
    romanisation: "tumhārā kuttā hamāre ghar mẽ hai."
    english: "Your dog is in our house."
  - hindi: "तेरा पापा कहाँ है?"
    romanisation: "terā pāpā kahā̃ hai?"
    english: "Where's your father?"
  - hindi: "आपके हाथ में क्या है?"
    romanisation: "āpke hāth mẽ kyā hai?"
    english: "What is in your hand?"
  - hindi: "ये कपड़े किसके हैं?"
    romanisation: "ye kapṛe kiske haĩ?"
    english: "Whose clothes are these?"
  - hindi: "मेरे तो नहीं हैं।"
    romanisation: "mere to nahī̃ haĩ."
    english: "They're not mine."
  - hindi: "यह मेरा दफ़्तर है।"
    romanisation: "yah merā daftar hai."
    english: "This is my office."
  - hindi: "यह दफ़्तर मेरा है।"
    romanisation: "yah daftar merā hai."
    english: "This office is mine."
  - hindi: "ऋषि अपने भाई से कितना बड़ा है?"
    romanisation: "Ṛṣi apne bhāī se kitnā baṛā hai?"
    english: "How much older is Rishi than his brother?"
  - hindi: "राज सबसे छोटा है – सिर्फ़ बारह साल का है।"
    romanisation: "Rāj sabse choṭā hai – sirf bārah sāl kā hai."
    english: "Raj is the youngest – he's only 12."
  - hindi: "ऋषि चौदह साल का है।"
    romanisation: "Ṛṣi caudah sāl kā hai."
    english: "Rishi is 14."
  - hindi: "और तुम, संगीता?"
    romanisation: "aur tum, Sangītā?"
    english: "And you, Sangeeta?"
  - hindi: "तुम्हारी उम्र कितनी है?"
    romanisation: "tumhārī umr kitnī hai?"
    english: "What's your age?"
  - hindi: "क्या तुम मुझसे बड़ी हो?"
    romanisation: "kyā tum mujhse baṛī ho?"
    english: "Are you older than me?"
  - hindi: "मैं उन्नीस साल की हूँ।"
    romanisation: "maĩ unnīs sāl kī hū̃."
    english: "I'm 19."
  - hindi: "मुझे मालूम नहीं कि तुम्हारी उम्र कितनी है।"
    romanisation: "mujhe mālūm nahī̃ ki tumhārī umr kitnī hai."
    english: "I don't know how old you are."
  - hindi: "मैं तुम से थोड़ा बड़ा हूँ – इक्कीस साल का हूँ।"
    romanisation: "maĩ tum se thoṛā baṛā hū̃ – ikkīs sāl kā hū̃."
    english: "I'm a little older than you – I'm 21."
  - hindi: "और लंबाई में भी तुम मुझसे बड़े हो।"
    romanisation: "aur lambāī mẽ bhī tum mujhse baṛe ho."
    english: "And you're taller than me too."
  - hindi: "यह व्यंग्य क्यों, संगीता?"
    romanisation: "yah vyaṅgy kyõ, Sangītā?"
    english: "Why this sarcasm, Sangeeta?"
  - hindi: "तुम मुझे क्यों नापसंद करती हो?"
    romanisation: "tum mujhe kyõ nāpasand kartī ho?"
    english: "Why do you dislike me?"
  - hindi: "कौन कहता है कि मैं तुम्हें नापसंद करती हूँ?"
    romanisation: "kaun kahtā hai ki maĩ tumhẽ nāpasand kartī hū̃?"
    english: "Who says I dislike you?"
  - hindi: "मैं तुम्हारे बारे में तो सोचती भी नहीं!"
    romanisation: "maĩ tumhāre bāre mẽ to soctī bhī nahī̃!"
    english: "I don't even think about you!"
  - hindi: "तुम तो सिर्फ़ अपने बारे में सोचती हो, अपने दोस्तों के बारे में नहीं।"
    romanisation: "tum to sirf apne bāre mẽ soctī ho, apne dostõ ke bāre mẽ nahī̃."
    english: "You only think about yourself, not about your friends."
  - hindi: "अच्छा, तो तुम अपने को मेरा दोस्त समझते हो?"
    romanisation: "acchā, to tum apne ko merā dost samajhte ho?"
    english: "I see, so you consider yourself my friend?"
  - hindi: "राज अपने कमरे में है।"
    romanisation: "Rāj apne kamre mẽ hai."
    english: "Raj is in his own room."
  - hindi: "राज उसके कमरे में है।"
    romanisation: "Rāj uske kamre mẽ hai."
    english: "Raj is in his (someone else's) room."
  - hindi: "मैं संगीता को अपनी किताब देता हूँ।"
    romanisation: "maĩ Sangītā ko apnī kitāb detā hū̃."
    english: "I give Sangeeta my book."
  - hindi: "सुहास संगीता को अपनी किताब देता है।"
    romanisation: "Suhās Sangītā ko apnī kitāb detā hai."
    english: "Suhas gives Sangeeta his book."
  - hindi: "संगीता सुहास को अपनी किताब देती है।"
    romanisation: "Sangītā Suhās ko apnī kitāb detī hai."
    english: "Sangeeta gives Suhas her book."
  - hindi: "हम अपने दोस्तों को ख़त लिखते हैं।"
    romanisation: "ham apne dostõ ko khat likhte haĩ."
    english: "We write letters to our friends."
  - hindi: "वे अपनी भाषा क्यों नहीं बोलते?"
    romanisation: "ve apnī bhāṣā kyõ nahī̃ bolte?"
    english: "Why don't they speak their own language?"
  - hindi: "मैं अपने भाई से लंबा हूँ।"
    romanisation: "maĩ apne bhāī se lambā hū̃."
    english: "I am taller than my brother."
  - hindi: "यह मेरी अपनी गाड़ी है।"
    romanisation: "yah merī apnī gāṛī hai."
    english: "This is my very own car."
  - hindi: "हिन्दी हमारी अपनी भाषा है।"
    romanisation: "hindī hamārī apnī bhāṣā hai."
    english: "Hindi is our own language."
  - hindi: "अपनी किताब पढ़ो।"
    romanisation: "apnī kitāb paṛho."
    english: "Read your book."
  - hindi: "मुझे अपने गंदे कपड़े दो।"
    romanisation: "mujhe apne gande kapṛe do."
    english: "Give me your dirty clothes."
  - hindi: "अपना ख़याल रखना।"
    romanisation: "apnā khayāl rakhnā."
    english: "Take care of yourself."
