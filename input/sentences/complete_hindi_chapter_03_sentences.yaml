title: "Complete Hindi"
subtitle: "Chapter 03"
items:
  - hindi: "कैसे हो प्रताप?"
    romanisation: "kaise ho Pratāp?"
    english: "How are you Pratap?"
  - hindi: "तुम्हारी तबीयत ठीक है न?"
    romanisation: "tumhārī tabiyat ṭhīk hai na?"
    english: "Your health is OK isn't it?"
  - hindi: "और वह मकान कैसा है?"
    romanisation: "aur vah makān kaisā hai?"
    english: "And what's that house like?"
  - hindi: "बिलकुल ठीक हूँ माँ।"
    romanisation: "bilkul ṭhīk hū̃ mā̃."
    english: "I'm absolutely fine Mum."
  - hindi: "और यह घर भी बुरा नहीं है।"
    romanisation: "aur yah ghar bhī burā nahī̃ hai."
    english: "And this house too isn't bad."
  - hindi: "कुमार परिवार कितना बड़ा है?"
    romanisation: "Kumār parivār kitnā baṛā hai?"
    english: "How big is the Kumar family?"
  - hindi: "सिर्फ़ पति-पत्नी हैं, या बच्चे भी हैं?"
    romanisation: "sirf pati-patnī haĩ, yā bacce bhī haĩ?"
    english: "Is it just husband and wife or are there children too?"
  - hindi: "परिवार में कई लोग हैं।"
    romanisation: "parivār mẽ kaī log haĩ."
    english: "There are several people in the family."
  - hindi: "अच्छा, काफ़ी बड़ा परिवार है!"
    romanisation: "acchā, kāfī baṛā parivār hai!"
    english: "Oh it's quite a big family!"
  - hindi: "मकान में कितने कमरे हैं?"
    romanisation: "makān mẽ kitne kamre haĩ?"
    english: "How many rooms are there in the house?"
  - hindi: "नौ बड़े कमरे हैं, और एक छोटा।"
    romanisation: "nau baṛe kamre haĩ, aur ek choṭā."
    english: "There are nine big rooms and one small."
  - hindi: "सब कमरों में सामान नया है।"
    romanisation: "sab kamrõ mẽ sāmān nayā hai."
    english: "The furniture in all the rooms is new."
  - hindi: "और तुम्हारा कमरा?"
    romanisation: "aur tumhārā kamrā?"
    english: "And your room?"
  - hindi: "कमरे में पंखा वग़ैरह है न?"
    romanisation: "kamre mẽ pankhā vagairah hai na?"
    english: "There's a fan etc. in the room isn't there?"
  - hindi: "हाँ, अब मेज़ पर नया पंखा है।"
    romanisation: "hā̃, ab mez par nayā pankhā hai."
    english: "Yes there's a new fan on the table now."
  - hindi: "और फ़र्श पर नई दरी भी है।"
    romanisation: "aur farś par naī darī bhī hai."
    english: "And there's a new rug on the floor too."
  - hindi: "घर ख़ाली है।"
    romanisation: "ghar khālī hai."
    english: "The house is vacant."
  - hindi: "घर में सामान है।"
    romanisation: "ghar mẽ sāmān hai."
    english: "There is furniture in the house."
  - hindi: "कमरा ख़ाली है।"
    romanisation: "kamrā khālī hai."
    english: "The room is vacant."
  - hindi: "कमरे में सामान है।"
    romanisation: "kamre mẽ sāmān hai."
    english: "There is furniture in the room."
  - hindi: "घरों में सामान है।"
    romanisation: "gharõ mẽ sāmān hai."
    english: "There is furniture in the houses."
  - hindi: "कमरों में सामान है।"
    romanisation: "kamrõ mẽ sāmān hai."
    english: "There is furniture in the rooms."
  - hindi: "मकान में कई कमरे हैं।"
    romanisation: "makān mẽ kaī kamre haĩ."
    english: "In the house there are several rooms."
  - hindi: "दीवारों पर तस्वीरें हैं।"
    romanisation: "dīvārõ par tasvīrẽ haĩ."
    english: "There are pictures on the walls."
  - hindi: "फ़र्श पर दरी है।"
    romanisation: "farś par darī hai."
    english: "There is a rug on the floor."
  - hindi: "अलमारियों में क्या है?"
    romanisation: "almāriyõ mẽ kyā hai?"
    english: "What's in the cupboards?"
  - hindi: "मेज़ पर क़लम है।"
    romanisation: "mez par qalam hai."
    english: "There is a pen on the table."
  - hindi: "क़लम मेज़ पर है।"
    romanisation: "qalam mez par hai."
    english: "The pen is on the table."
