title: "Complete Hindi"
subtitle: "Chapter 04"
items:
  - id: "0001"
    hindi: "संगीता, आज तुम क्लास में क्यों नहीं थीं?"
    romanisation: "Sangītā, āj tum klās mẽ kyõ nahī̃ thī̃?"
    english: "Sangeeta, why weren't you in class today?"
  - id: "0002"
    hindi: "तुम कहाँ थीं?"
    romanisation: "tum kahā̃ thī̃?"
    english: "Where were you?"
  - id: "0003"
    hindi: "मैं घर पर थी।"
    romanisation: "maĩ ghar par thī."
    english: "I was at home."
  - id: "0004"
    hindi: "सुहास भी था।"
    romanisation: "Suhās bhī thā."
    english: "Suhas was there too."
  - id: "0005"
    hindi: "दूसरे लोग बाहर थे।"
    romanisation: "dūsre log bāhar the."
    english: "The others were out."
  - id: "0006"
    hindi: "वह ख़ूबसूरत आदमी?"
    romanisation: "vah khūbsūrat ādmī?"
    english: "That handsome man?"
  - id: "0007"
    hindi: "वह कौन है – दोस्त या रिश्तेदार?"
    romanisation: "vah kaun hai – dost yā riśtedār?"
    english: "Who is he – friend or relative?"
  - id: "0008"
    hindi: "रिश्तेदार तो नहीं, वह मेरा बहुत पुराना दोस्त है।"
    romanisation: "riśtedār to nahī̃, vah merā bahut purānā dost hai."
    english: "Not a relative, he's my very old friend."
  - id: "0009"
    hindi: "यह तुम्हारा दोस्त उम्र में तुमसे काफ़ी बड़ा है!"
    romanisation: "yah tumhārā dost umr mẽ tumse kāfī baṛā hai!"
    english: "This friend of yours is quite a lot older than you!"
  - id: "0010"
    hindi: "हाँ मुझसे बड़ा तो है, पर बहुत प्यारा आदमी है।"
    romanisation: "hā̃ mujhse baṛā to hai, par bahut pyārā ādmī hai."
    english: "Yes he is older than me, but he's a very dear man."
  - id: "0011"
    hindi: "क्या वह दिल्ली से है?"
    romanisation: "kyā vah dillī se hai?"
    english: "Is he from Delhi?"
  - id: "0012"
    hindi: "या विदेश से?"
    romanisation: "yā videś se?"
    english: "Or from abroad?"
  - id: "0013"
    hindi: "वे लोग पहले लंदन में थे।"
    romanisation: "ve log pahle landan mẽ the."
    english: "They were in London before."
  - id: "0014"
    hindi: "पर अब तो सुहास अकेला है।"
    romanisation: "par ab to Suhās akelā hai."
    english: "But now Suhas is alone."
  - id: "0015"
    hindi: "और सुहास सिर्फ़ तुम्हारा \"दोस्त\" है क्या?"
    romanisation: "aur Suhās sirf tumhārā \"dost\" hai kyā?"
    english: "And Suhas is just your 'friend'?"
  - id: "0016"
    hindi: "छोटू, क्या तुमको मालूम है कि रामदास कहाँ है?"
    romanisation: "Choṭū, kyā tumko mālūm hai ki Rāmdās kahā̃ hai?"
    english: "Chotu, do you know where Ramdas is?"
  - id: "0017"
    hindi: "रामदास घर पर है।"
    romanisation: "Rāmdās ghar par hai."
    english: "Ramdas is at home."
  - id: "0018"
    hindi: "उसको ज़ुकाम है।"
    romanisation: "usko zukām hai."
    english: "He's got a cold."
  - id: "0019"
    hindi: "अरे, वह कल भी बीमार था!"
    romanisation: "are, vah kal bhī bīmār thā!"
    english: "What! He was ill yesterday too!"
  - id: "0020"
    hindi: "आज प्रकाश जी भी यहाँ नहीं हैं।"
    romanisation: "āj Prakāś jī bhī yahā̃ nahī̃ haĩ."
    english: "Prakash ji is not here today either."
  - id: "0021"
    hindi: "क्यों?"
    romanisation: "kyõ?"
    english: "Why?"
  - id: "0022"
    hindi: "क्या बात है?"
    romanisation: "kyā bāt hai?"
    english: "What's the matter?"
  - id: "0023"
    hindi: "क्या उसको भी ज़ुकाम है?"
    romanisation: "kyā usko bhī zukām hai?"
    english: "Has he got a cold too?"
  - id: "0024"
    hindi: "कल तो उनको बुख़ार था।"
    romanisation: "kal to unko bukhār thā."
    english: "Yesterday he had a fever."
  - id: "0025"
    hindi: "वे शायद आज भी बीमार हैं।"
    romanisation: "ve śāyad āj bhī bīmār haĩ."
    english: "Maybe he's ill today as well."
  - id: "0026"
    hindi: "या उसको काम पसंद नहीं है, शायद!"
    romanisation: "yā usko kām pasand nahī̃ hai, śāyad!"
    english: "Or he doesn't like work, maybe!"
  - id: "0027"
    hindi: "वह बात नहीं है खन्ना जी – प्रकाश जी बहुत मेहनती आदमी हैं।"
    romanisation: "vah bāt nahī̃ hai, Khannā jī – Prakāś jī bahut mehnatī ādmī haĩ."
    english: "That's not it Khanna ji – Prakash ji's a very hardworking man."
  - id: "0028"
    hindi: "तुम अच्छे लड़के हो छोटू, लेकिन तुमको कुछ नहीं मालूम है।"
    romanisation: "tum acche laṛke ho Choṭū, lekin tumko kuch nahī̃ mālūm hai."
    english: "You're a good lad Chotu, but you don't know anything."
  - id: "0029"
    hindi: "मैं कल दफ़्तर में था।"
    romanisation: "maĩ kal daftar mẽ thā."
    english: "Yesterday I was in the office."
  - id: "0030"
    hindi: "चाचा जी दुकान में थे।"
    romanisation: "cācā jī dukān mẽ the."
    english: "Uncle was in the shop."
  - id: "0031"
    hindi: "माँ भी घर पर नहीं थीं।"
    romanisation: "mā̃ bhī ghar par nahī̃ thī̃."
    english: "Mum too wasn't at home."
  - id: "0032"
    hindi: "दोनों बच्चे बीमार थे।"
    romanisation: "donõ bacce bīmār the."
    english: "Both children were ill."
  - id: "0033"
    hindi: "गोलियाँ मेज़ पर थीं।"
    romanisation: "goliyā̃ mez par thī̃."
    english: "The pills were on the table."
  - id: "0034"
    hindi: "तो क्या दुकान बंद है?"
    romanisation: "to kyā dukān band hai?"
    english: "So is the shop closed?"
  - id: "0035"
    hindi: "अच्छा, तो तुम लंदन से हो?"
    romanisation: "acchā, to tum landan se ho?"
    english: "Ah, then you're from London?"
  - id: "0036"
    hindi: "खाना तो गर्म था, पर चाय एकदम ठंडी थी।"
    romanisation: "khānā to garam thā, par cāy ekdam ṭhaṇḍī thī."
    english: "The food was hot, but the tea was completely cold."
  - id: "0037"
    hindi: "खाना अच्छा तो था, पर महँगा भी था।"
    romanisation: "khānā acchā to thā, par mahãgā bhī thā."
    english: "The food was good, but it was expensive too."
  - id: "0038"
    hindi: "संगीता राज से लंबी है।"
    romanisation: "Sangītā Rāj se lambī hai."
    english: "Sangeeta is taller than Raj."
  - id: "0039"
    hindi: "राज संगीता से मोटा है।"
    romanisation: "Rāj Sangītā se moṭā hai."
    english: "Raj is fatter than Sangeeta."
  - id: "0040"
    hindi: "ऋषि संगीता से ज़्यादा लंबा है।"
    romanisation: "Ṛṣi Sangītā se zyādā lambā hai."
    english: "Rishi is taller than Sangeeta."
  - id: "0041"
    hindi: "ऋषि ज़्यादा लंबा है।"
    romanisation: "Ṛṣi zyādā lambā hai."
    english: "Rishi is taller."
  - id: "0042"
    hindi: "राज ज़्यादा मोटा है।"
    romanisation: "Rāj zyādā moṭā hai."
    english: "Raj is fatter."
  - id: "0043"
    hindi: "चाँदी सोने से कम महँगी है।"
    romanisation: "cā̃dī sone se kam mahãgī hai."
    english: "Silver is less costly than gold."
  - id: "0044"
    hindi: "ये चीज़ें कम महँगी हैं।"
    romanisation: "ye cīzẽ kam mahãgī haĩ."
    english: "These things are less expensive."
  - id: "0045"
    hindi: "मैं सब से लंबा हूँ।"
    romanisation: "maĩ sab se lambā hū̃."
    english: "I am the tallest."
  - id: "0046"
    hindi: "दादीजी को ज़ुकाम था।"
    romanisation: "dādījī ko zukām thā."
    english: "Granny had a cold."
  - id: "0047"
    hindi: "दोनों भाइयों को ज़ुकाम था।"
    romanisation: "donõ bhāiyõ ko zukām thā."
    english: "Both brothers had a cold."
  - id: "0048"
    hindi: "सौ लोगों को ज़ुकाम था।"
    romanisation: "sau logõ ko zukām thā."
    english: "A hundred people had a cold."
  - id: "0049"
    hindi: "तुम को बुख़ार था।"
    romanisation: "tum ko bukhār thā."
    english: "You had a fever."
  - id: "0050"
    hindi: "हम को अफ़सोस है कि तुम बीमार हो।"
    romanisation: "ham ko afsos hai ki tum bīmār ho."
    english: "We're sorry that you're ill."
  - id: "0051"
    hindi: "मुझ को आशा है कि वे ठीक हैं।"
    romanisation: "mujh ko āśā hai ki ve ṭhīk haĩ."
    english: "I hope they're OK."
  - id: "0052"
    hindi: "उन को ख़ुशी थी कि गाड़ी सस्ती थी।"
    romanisation: "un ko khuśī thī ki gāṛī sastī thī."
    english: "They were pleased the car was cheap."
  - id: "0053"
    hindi: "उस को समोसे पसंद हैं।"
    romanisation: "us ko samose pasand haĩ."
    english: "He/she likes samosas."
  - id: "0054"
    hindi: "हाँ, मुझ को मालूम है।"
    romanisation: "hā̃, mujh ko mālūm hai."
    english: "Yes, I know."
  - id: "0055"
    hindi: "क्या उस को दाल पसंद है?"
    romanisation: "kyā us ko dāl pasand hai?"
    english: "Does he/she like daal?"
  - id: "0056"
    hindi: "हम को मालूम नहीं।"
    romanisation: "ham ko mālūm nahī̃."
    english: "We don't know."
  - id: "0057"
    hindi: "क्या तुमको मालूम है कि राज कहाँ है?"
    romanisation: "kyā tumko mālūm hai ki Rāj kahā̃ hai?"
    english: "Do you know where Raj is?"
  - id: "0058"
    hindi: "क्या उसको मालूम है कि मैं कौन हूँ?"
    romanisation: "kyā usko mālūm hai ki maĩ kaun hū̃?"
    english: "Does he/she know who I am?"
  - id: "0059"
    hindi: "मुझको नहीं मालूम कि यह क्या है।"
    romanisation: "mujhko nahī̃ mālūm ki yah kyā hai."
    english: "I don't know what this is."
