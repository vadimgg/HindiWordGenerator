title: "Complete Hindi"
subtitle: "Chapter 02"
items:
  - hindi: "अध्यापक जी, यहाँ कितने विद्यार्थी हैं?"
    romanisation: "adhyāpak jī, yahā̃ kitne vidyārthī haĩ?"
    english: "Teacher ji, how many students are here?"
  - hindi: "अभी चौदह हैं – नौ लड़कियाँ और पाँच लड़के।"
    romanisation: "abhī caudah haĩ – nau laṛkiyā̃ aur pā̃c laṛke."
    english: "At the moment there are 14 – nine girls and five boys."
  - hindi: "यह किताब कैसी है?"
    romanisation: "yah kitāb kaisī hai?"
    english: "What kind of book is this?"
  - hindi: "क्या यह अच्छी है?"
    romanisation: "kyā yah acchī hai?"
    english: "Is it good?"
  - hindi: "हाँ, बुरी नहीं है।"
    romanisation: "hā̃, burī nahī̃ hai."
    english: "Yes, it's not bad."
  - hindi: "लेकिन सस्ती नहीं है, काफ़ी महँगी है।"
    romanisation: "lekin sastī nahī̃ hai, kāfī mahãgī hai."
    english: "But it's not cheap, it's quite expensive."
  - hindi: "क्या ये शब्दकोश भी महँगे हैं?"
    romanisation: "kyā ye śabdkoś bhī mahãge haĩ?"
    english: "Are these dictionaries also expensive?"
  - hindi: "नहीं, बिलकुल नहीं।"
    romanisation: "nahī̃, bilkul nahī̃."
    english: "No, not at all."
  - hindi: "बहुत सस्ते हैं।"
    romanisation: "bahut saste haĩ."
    english: "They're very cheap."
  - hindi: "और वह मोटी किताब क्या है?"
    romanisation: "aur vah moṭī kitāb kyā hai?"
    english: "And what is that thick book?"
  - hindi: "क्या वह भी शब्दकोश है?"
    romanisation: "kyā vah bhī śabdkoś hai?"
    english: "Is it a dictionary too?"
  - hindi: "नहीं नहीं, वह शब्दकोश नहीं है, रामायण है!"
    romanisation: "nahī̃ nahī̃, vah śabdkoś nahī̃ hai, rāmāyaṇ hai!"
    english: "No no, it's not a dictionary, it's the Ramayan!"
  - hindi: "हलो राज, क्या हाल है?"
    romanisation: "halo Rāj, kyā hāl hai?"
    english: "Hello Raj, how're things?"
  - hindi: "सब ठीक है?"
    romanisation: "sab ṭhīk hai?"
    english: "Everything OK?"
  - hindi: "हाँ, सब ठीक है।"
    romanisation: "hā̃, sab ṭhīk hai."
    english: "Yes, everything's OK."
  - hindi: "और आप कैसे हैं?"
    romanisation: "aur āp kaise haĩ?"
    english: "And how are you?"
  - hindi: "मैं भी अच्छा हूँ, शुक्रिया।"
    romanisation: "maĩ bhī acchā hū̃, śukriyā."
    english: "I'm well too, thank you."
  - hindi: "ऋषि और संगीता कैसे हैं?"
    romanisation: "Ṛṣi aur Sangītā kaise haĩ?"
    english: "How are Rishi and Sangeeta?"
  - hindi: "ऋषि अच्छा है, लेकिन संगीता अच्छी नहीं है।"
    romanisation: "Ṛṣi acchā hai, lekin Sangītā acchī nahī̃ hai."
    english: "Rishi is well, but Sangeeta isn't all right."
  - hindi: "क्यों?"
    romanisation: "kyõ?"
    english: "Why?"
  - hindi: "क्या बात है?"
    romanisation: "kyā bāt hai?"
    english: "What's the matter?"
  - hindi: "क्या वह बीमार है?"
    romanisation: "kyā vah bīmār hai?"
    english: "Is she ill?"
  - hindi: "नहीं, वह नाराज़ है क्योंकि आप यहाँ हैं!"
    romanisation: "nahī̃, vah nārāz hai kyõki āp yahā̃ haĩ!"
    english: "No, she's in a huff because you're here!"
  - hindi: "यह बहुत बुरी बात है!"
    romanisation: "yah bahut burī bāt hai!"
    english: "This is a very bad thing!"
  - hindi: "पर संगीता क्यों परेशान है?"
    romanisation: "par Sangītā kyõ pareśān hai?"
    english: "But why is Sangeeta upset?"
  - hindi: "मालूम नहीं।"
    romanisation: "mālūm nahī̃."
    english: "I don't know."
  - hindi: "लड़की है, न?"
    romanisation: "laṛkī hai, na?"
    english: "She's a girl, isn't she?"
