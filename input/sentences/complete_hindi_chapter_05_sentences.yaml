title: "Complete Hindi"
subtitle: "Chapter 05"
items:
  - id: "0001"
    hindi: "आइए सुरेश।"
    romanisation: "āie Sureś."
    english: "Come, Suresh."
  - id: "0002"
    hindi: "खाना तैयार है, बैठिए।"
    romanisation: "khānā taiyār hai, baiṭhie."
    english: "The food is ready, please sit."
  - id: "0003"
    hindi: "शुक्रिया।"
    romanisation: "śukriyā."
    english: "Thanks."
  - id: "0004"
    hindi: "अच्छा, तो तुम अकेली नहीं हो।"
    romanisation: "acchā, to tum akelī nahī̃ ho."
    english: "Ah, you're not alone then."
  - id: "0005"
    hindi: "दूसरे बच्चे कहाँ हैं?"
    romanisation: "dūsre bacce kahā̃ haĩ?"
    english: "Where are the other children?"
  - id: "0006"
    hindi: "वे तो अभी बाहर हैं, खान मार्केट में।"
    romanisation: "ve to abhī bāhar haĩ, khān mārkeṭ mẽ."
    english: "They're out at the moment, in Khan Market."
  - id: "0007"
    hindi: "राज, तू बैठ।"
    romanisation: "Rāj, tū baiṭh."
    english: "Raj, sit down."
  - id: "0008"
    hindi: "इधर मत बैठ, उधर बैठ।"
    romanisation: "idhar mat baiṭh, udhar baiṭh."
    english: "Don't sit here, sit there."
  - id: "0009"
    hindi: "अम्माँ, मुझको चाय दो।"
    romanisation: "ammā̃, mujhko cāy do."
    english: "Mum, give me tea."
  - id: "0010"
    hindi: "मुझको दूध पसंद नहीं।"
    romanisation: "mujhko dūdh pasand nahī̃."
    english: "I don't like milk."
  - id: "0011"
    hindi: "तू चाय मत पी, दूध पी।"
    romanisation: "tū cāy mat pī, dūdh pī."
    english: "Don't drink tea, drink milk."
  - id: "0012"
    hindi: "तू तो अभी बहुत छोटा है बेटा!"
    romanisation: "tū to abhī bahut choṭā hai beṭā!"
    english: "You're still very young, son!"
  - id: "0013"
    hindi: "सुरेश अंकल, अम्माँ से कहिए कि मैं छोटा बच्चा नहीं हूँ।"
    romanisation: "Sureś ankal, ammā̃ se kahie ki maĩ choṭā baccā nahī̃ hū̃."
    english: "Suresh Uncle, tell Mum that I'm not a little kid."
  - id: "0014"
    hindi: "नहीं राज, तुम तो बहुत बड़े आदमी हो!"
    romanisation: "nahī̃ Rāj, tum to bahut baṛe ādmī ho!"
    english: "No Raj, you're a very big fellow!"
  - id: "0015"
    hindi: "कमला, राज साहब को चाय दो!"
    romanisation: "Kamalā, Rāj sāhab ko cāy do!"
    english: "Kamala, give Raj Sahib tea!"
  - id: "0016"
    hindi: "सुनिए सुरेश, राज बड़ा आदमी तो है, लेकिन बड़ा शैतान भी है!"
    romanisation: "sunie Sureś, Rāj baṛā ādmī to hai, lekin baṛā śaitān bhī hai!"
    english: "Listen Suresh, Raj is a big man, but he's a big devil too!"
  - id: "0017"
    hindi: "राज, तुम्हें मालूम है कि अरुण चाचा की चाबियाँ कहाँ हैं?"
    romanisation: "Rāj, tumhẽ mālūm hai ki Aruṇ cācā kī cābiyā̃ kahā̃ haĩ?"
    english: "Raj, do you know where Uncle Arun's keys are?"
  - id: "0018"
    hindi: "कौनसी चाबियाँ?"
    romanisation: "kaunsī cābiyā̃?"
    english: "Which keys?"
  - id: "0019"
    hindi: "गाड़ी की चाबियाँ या घर की?"
    romanisation: "gāṛī kī cābiyā̃ yā ghar kī?"
    english: "The car keys or the house ones?"
  - id: "0020"
    hindi: "कल तो संगीता के कमरे में थीं, उसकी मेज़ पर।"
    romanisation: "kal to Sangītā ke kamre mẽ thī̃, uskī mez par."
    english: "Yesterday they were in Sangeeta's room, on her table."
  - id: "0021"
    hindi: "तो मुझसे मत पूछो, संगीता से पूछो।"
    romanisation: "to mujhse mat pūcho, Sangītā se pūcho."
    english: "So don't ask me, ask Sangeeta."
  - id: "0022"
    hindi: "मैं संगीता का नौकर हूँ क्या?"
    romanisation: "maĩ Sangītā kā naukar hū̃ kyā?"
    english: "Am I Sangeeta's servant?"
  - id: "0023"
    hindi: "नहीं राज, नौकर नहीं हो, तुम तो सचमुच \"राजा\" हो!"
    romanisation: "nahī̃ Rāj, naukar nahī̃ ho, tum to sacmuc \"rājā\" ho!"
    english: "No Raj, you're not a servant, you really are a 'raja'!"
  - id: "0024"
    hindi: "अरे बच्चो! झगड़ा मत करो!"
    romanisation: "are bacco! jhagṛā mat karo!"
    english: "Hey children! Don't squabble!"
  - id: "0025"
    hindi: "मुझे घर की चाबियाँ जल्दी दो।"
    romanisation: "mujhe ghar kī cābiyā̃ jaldī do."
    english: "Give me the house keys quickly."
  - id: "0026"
    hindi: "उधर देखिए अंकल!"
    romanisation: "udhar dekhie ankal!"
    english: "Look over there Uncle!"
  - id: "0027"
    hindi: "दरवाज़े की चाबी पापा की मेज़ पर पड़ी है।"
    romanisation: "darvāze kī cābī pāpā kī mez par paṛī hai."
    english: "The door key is lying on Papa's table."
  - id: "0028"
    hindi: "मुझसे कहो।"
    romanisation: "mujhse kaho."
    english: "Tell me."
  - id: "0029"
    hindi: "पापा से न पूछो।"
    romanisation: "pāpā se na pūcho."
    english: "Don't ask Papa."
  - id: "0030"
    hindi: "वह पान मत खा!"
    romanisation: "vah pān mat khā!"
    english: "Don't eat that paan!"
  - id: "0031"
    hindi: "यह पैसा लो।"
    romanisation: "yah paisā lo."
    english: "Take this money."
  - id: "0032"
    hindi: "ध्यान से सुनिए।"
    romanisation: "dhyān se sunie."
    english: "Please listen with care."
  - id: "0033"
    hindi: "उनका नाम लिखिएगा।"
    romanisation: "unkā nām likhiegā."
    english: "Kindly write their name."
  - id: "0034"
    hindi: "लंदन से ख़त लिखना।"
    romanisation: "landan se khat likhnā."
    english: "Write a letter from London."
  - id: "0035"
    hindi: "उस आदमी का बेटा विद्यार्थी है।"
    romanisation: "us ādmī kā beṭā vidyārthī hai."
    english: "That man's son is a student."
  - id: "0036"
    hindi: "उन लोगों के कपड़े बहुत गंदे हैं।"
    romanisation: "un logõ ke kapṛe bahut gande haĩ."
    english: "Those people's clothes are very dirty."
  - id: "0037"
    hindi: "खन्ना की बहिन के कुत्ते का नाम चीकू है।"
    romanisation: "Khannā kī bahin ke kutte kā nām Cīkū hai."
    english: "Khanna's sister's dog's name is Chikoo."
  - id: "0038"
    hindi: "हम को गरम खाना खिलाओ।"
    romanisation: "ham ko garam khānā khilāo."
    english: "Serve us hot food."
  - id: "0039"
    hindi: "धोबी को गंदे कपड़े देना।"
    romanisation: "dhobī ko gande kapṛe denā."
    english: "Give the dirty clothes to the dhobi."
  - id: "0040"
    hindi: "उनको मेरा नाम मत बताना!"
    romanisation: "unko merā nām mat batānā!"
    english: "Don't tell them my name!"
  - id: "0041"
    hindi: "भैया, चाय लाओ।"
    romanisation: "bhaiyā, cāy lāo."
    english: "Brother, bring tea."
  - id: "0042"
    hindi: "समोसा खाओ।"
    romanisation: "samosā khāo."
    english: "Have a samosa."
  - id: "0043"
    hindi: "पानी पियो।"
    romanisation: "pānī piyo."
    english: "Drink water."
  - id: "0044"
    hindi: "एक कुर्सी लाओ।"
    romanisation: "ek kursī lāo."
    english: "Bring a chair."
  - id: "0045"
    hindi: "कुर्सी को साफ़ करो।"
    romanisation: "kursī ko sāf karo."
    english: "Clean the chair."
  - id: "0046"
    hindi: "यह किताब अच्छी है – इसको पढ़ो।"
    romanisation: "yah kitāb acchī hai – isko paṛho."
    english: "This book's good – read it."
  - id: "0047"
    hindi: "छोटू को मत मारना।"
    romanisation: "Choṭū ko mat mārnā."
    english: "Don't hit Chotu."
  - id: "0048"
    hindi: "पिताजी को बुलाइए।"
    romanisation: "pitājī ko bulāie."
    english: "Call Father."
  - id: "0049"
    hindi: "उनको जगाइए।"
    romanisation: "unko jagāie."
    english: "Wake them up."
  - id: "0050"
    hindi: "मुझे अफ़सोस है कि तुमको ज़ुकाम है।"
    romanisation: "mujhe afsos hai ki tumko zukām hai."
    english: "I'm sorry that you have a cold."
  - id: "0051"
    hindi: "हमें मालूम है कि उसको बुख़ार है।"
    romanisation: "hamẽ mālūm hai ki usko bukhār hai."
    english: "We know that he has a fever."
