[package]
name = "lingo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lingo"
path = "src/main.rs"

[dependencies]
lingo-application = { path = "../lingo-application" }
lingo-domain = { path = "../lingo-domain" }
lingo-workspace-fs = { path = "../lingo-workspace-fs" }
lingo-prompt = { path = "../lingo-prompt" }
lingo-audio = { path = "../lingo-audio" }
lingo-artifacts = { path = "../lingo-artifacts" }
clap = { workspace = true, features = ["derive"] }
console.workspace = true
open.workspace = true
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "native-tls"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tiny_http.workspace = true
toml.workspace = true
which.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
zip.workspace = true

[lints]
workspace = true
